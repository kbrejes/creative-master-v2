<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acid Loading Showcase</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh; padding: 30px;
  }
  h1 { text-align: center; font-size: 20px; color: #888; margin-bottom: 30px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .cell {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 24px 16px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-height: 200px;
    justify-content: center;
  }
  .cell .label {
    font-size: 13px; color: #888; font-weight: 600;
  }
  .cell .num {
    font-size: 11px; color: #555;
    background: #222; border-radius: 4px; padding: 2px 8px;
  }
  .anim-wrap {
    width: 70px; height: 70px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }

  /* ========================================================
     #1 — PLASMA ORB
     Glowing sphere with rotating conic overlay + pulsing halo
     ======================================================== */
  .plasma-orb {
    width: 56px; height: 56px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 35% 35%, #ff00ff, #0040ff 50%, #00ffaa 100%);
    animation: plasma-spin 3s linear infinite;
    box-shadow: 0 0 20px #ff00ff88, 0 0 40px #0040ff44, inset 0 0 15px rgba(255,255,255,0.2);
  }
  .plasma-orb::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(transparent, #ff00ff88, transparent, #00ffaa88, transparent);
    animation: plasma-spin 2s linear infinite reverse;
    filter: blur(6px);
  }
  .plasma-orb::after {
    content: ''; position: absolute; inset: 8px; border-radius: 50%;
    background: radial-gradient(circle at 60% 40%, rgba(255,255,255,0.4), transparent 60%);
    animation: plasma-pulse 2s ease-in-out infinite;
  }
  @keyframes plasma-spin { to { transform: rotate(360deg); } }
  @keyframes plasma-pulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.1); } }

  /* ========================================================
     #2 — MORPHING BLOB
     Organic shape with animated border-radius + gradient shift
     ======================================================== */
  .morph-blob {
    width: 56px; height: 56px; position: relative;
    background: linear-gradient(135deg, #ff073a, #bf00ff, #0040ff);
    background-size: 300% 300%;
    animation: morph-shape 4s ease-in-out infinite, morph-gradient 6s ease infinite;
    filter: blur(0px);
    box-shadow: 0 0 25px #bf00ff66, 0 0 50px #ff073a33;
  }
  .morph-blob::after {
    content: ''; position: absolute; inset: 6px;
    background: #111; border-radius: inherit;
    animation: morph-shape 4s ease-in-out infinite reverse;
  }
  @keyframes morph-shape {
    0%   { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    25%  { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
    50%  { border-radius: 50% 60% 30% 60% / 30% 40% 70% 60%; }
    75%  { border-radius: 60% 30% 60% 40% / 70% 50% 40% 60%; }
    100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
  }
  @keyframes morph-gradient {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ========================================================
     #3 — HYPNOTIC SPIRAL
     Rotating conic stripes creating depth illusion
     ======================================================== */
  .spiral-wrap { width: 60px; height: 60px; position: relative; }
  .spiral {
    width: 100%; height: 100%; border-radius: 50%;
    background: repeating-conic-gradient(
      #bf00ff 0deg, #111 10deg, #39ff14 20deg, #111 30deg,
      #ff073a 40deg, #111 50deg, #fff700 60deg, #111 70deg,
      #0040ff 80deg, #111 90deg
    );
    animation: spiral-spin 6s linear infinite;
    mask: radial-gradient(circle, black 45%, transparent 70%);
    -webkit-mask: radial-gradient(circle, black 45%, transparent 70%);
  }
  .spiral::after {
    content: ''; position: absolute; inset: 18px; border-radius: 50%;
    background: #111;
    box-shadow: 0 0 10px #bf00ff88;
  }
  .spiral-wrap::before {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    background: conic-gradient(#bf00ff44, transparent, #39ff1444, transparent, #ff073a44, transparent);
    animation: spiral-spin 4s linear infinite reverse;
    filter: blur(8px);
  }
  @keyframes spiral-spin { to { transform: rotate(360deg); } }

  /* ========================================================
     #4 — WORMHOLE TUNNEL
     Concentric rings scaling inward for 3D depth effect
     ======================================================== */
  .wormhole { width: 60px; height: 60px; position: relative; }
  .wh-ring {
    position: absolute; border-radius: 50%;
    border: 2px solid; opacity: 0;
    animation: wh-dive 2.5s ease-in infinite;
  }
  .wh-ring:nth-child(1) { border-color: #bf00ff; animation-delay: 0s; }
  .wh-ring:nth-child(2) { border-color: #39ff14; animation-delay: 0.35s; }
  .wh-ring:nth-child(3) { border-color: #ff073a; animation-delay: 0.7s; }
  .wh-ring:nth-child(4) { border-color: #0040ff; animation-delay: 1.05s; }
  .wh-ring:nth-child(5) { border-color: #fff700; animation-delay: 1.4s; }
  .wh-ring:nth-child(6) { border-color: #bf00ff; animation-delay: 1.75s; }
  .wh-ring:nth-child(7) { border-color: #39ff14; animation-delay: 2.1s; }
  @keyframes wh-dive {
    0%   { inset: -10px; opacity: 0; transform: scale(1.4); }
    20%  { opacity: 0.9; }
    80%  { opacity: 0.3; }
    100% { inset: 26px; opacity: 0; transform: scale(0.1); }
  }

  /* ========================================================
     #5 — DNA HELIX
     Two intertwined strands of dots spinning in 3D
     ======================================================== */
  .dna { width: 30px; height: 60px; position: relative; }
  .dna-dot {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    left: 50%; transform: translateX(-50%);
  }
  .dna-dot.a { background: #bf00ff; box-shadow: 0 0 8px #bf00ff; }
  .dna-dot.b { background: #39ff14; box-shadow: 0 0 8px #39ff14; }
  .dna-dot:nth-child(1)  { animation: dna-a 1.6s ease-in-out infinite; top: 0px; }
  .dna-dot:nth-child(2)  { animation: dna-b 1.6s ease-in-out infinite; top: 0px; }
  .dna-dot:nth-child(3)  { animation: dna-a 1.6s ease-in-out -0.2s infinite; top: 8px; }
  .dna-dot:nth-child(4)  { animation: dna-b 1.6s ease-in-out -0.2s infinite; top: 8px; }
  .dna-dot:nth-child(5)  { animation: dna-a 1.6s ease-in-out -0.4s infinite; top: 16px; }
  .dna-dot:nth-child(6)  { animation: dna-b 1.6s ease-in-out -0.4s infinite; top: 16px; }
  .dna-dot:nth-child(7)  { animation: dna-a 1.6s ease-in-out -0.6s infinite; top: 24px; }
  .dna-dot:nth-child(8)  { animation: dna-b 1.6s ease-in-out -0.6s infinite; top: 24px; }
  .dna-dot:nth-child(9)  { animation: dna-a 1.6s ease-in-out -0.8s infinite; top: 32px; }
  .dna-dot:nth-child(10) { animation: dna-b 1.6s ease-in-out -0.8s infinite; top: 32px; }
  .dna-dot:nth-child(11) { animation: dna-a 1.6s ease-in-out -1.0s infinite; top: 40px; }
  .dna-dot:nth-child(12) { animation: dna-b 1.6s ease-in-out -1.0s infinite; top: 40px; }
  .dna-dot:nth-child(13) { animation: dna-a 1.6s ease-in-out -1.2s infinite; top: 48px; }
  .dna-dot:nth-child(14) { animation: dna-b 1.6s ease-in-out -1.2s infinite; top: 48px; }
  @keyframes dna-a {
    0%,100% { transform: translateX(-14px) scale(1); opacity: 1; }
    50%     { transform: translateX(14px) scale(0.5); opacity: 0.3; }
  }
  @keyframes dna-b {
    0%,100% { transform: translateX(14px) scale(0.5); opacity: 0.3; }
    50%     { transform: translateX(-14px) scale(1); opacity: 1; }
  }

  /* ========================================================
     #6 — LIQUID LAVA
     Metaball-style blobs using blur + contrast trick
     ======================================================== */
  .lava-wrap {
    width: 70px; height: 70px; position: relative;
    filter: contrast(20) brightness(0.7);
    background: #111; border-radius: 50%; overflow: hidden;
  }
  .lava-blob {
    position: absolute; border-radius: 50%;
    filter: blur(5px);
  }
  .lava-blob:nth-child(1) {
    width: 26px; height: 26px; background: #bf00ff;
    animation: lava1 3s ease-in-out infinite;
    top: 10px; left: 10px;
  }
  .lava-blob:nth-child(2) {
    width: 22px; height: 22px; background: #39ff14;
    animation: lava2 3.5s ease-in-out infinite;
    top: 30px; left: 30px;
  }
  .lava-blob:nth-child(3) {
    width: 20px; height: 20px; background: #ff073a;
    animation: lava3 2.8s ease-in-out infinite;
    top: 15px; left: 35px;
  }
  .lava-blob:nth-child(4) {
    width: 18px; height: 18px; background: #0040ff;
    animation: lava4 3.2s ease-in-out infinite;
    top: 35px; left: 12px;
  }
  @keyframes lava1 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(20px,15px); } 66% { transform: translate(10px,25px); } }
  @keyframes lava2 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(-18px,-12px); } 66% { transform: translate(-8px,10px); } }
  @keyframes lava3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-20px,15px); } }
  @keyframes lava4 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(18px,-15px); } }

  /* ========================================================
     #7 — FRACTAL TRIANGLES
     Nested rotating triangles getting smaller
     ======================================================== */
  .fractal { width: 60px; height: 60px; position: relative; }
  .fractal-tri {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .fractal-tri::before {
    content: '';
    width: 0; height: 0;
    border-left: var(--sz) solid transparent;
    border-right: var(--sz) solid transparent;
    border-bottom: calc(var(--sz) * 1.73) solid var(--clr);
    filter: drop-shadow(0 0 4px var(--clr));
  }
  .fractal-tri:nth-child(1) { --sz: 28px; --clr: #bf00ff; animation: fractal-spin 6s linear infinite; }
  .fractal-tri:nth-child(2) { --sz: 20px; --clr: #39ff14; animation: fractal-spin 4s linear infinite reverse; }
  .fractal-tri:nth-child(3) { --sz: 14px; --clr: #ff073a; animation: fractal-spin 3s linear infinite; }
  .fractal-tri:nth-child(4) { --sz: 9px; --clr: #fff700; animation: fractal-spin 2s linear infinite reverse; }
  .fractal-tri:nth-child(5) { --sz: 5px; --clr: #0040ff; animation: fractal-spin 1.5s linear infinite; }
  @keyframes fractal-spin { to { transform: rotate(360deg); } }

  /* ========================================================
     #8 — PULSING MANDALA
     Radiating petals that bloom and fade
     ======================================================== */
  .mandala { width: 60px; height: 60px; position: relative; animation: mandala-hue 8s linear infinite; }
  .mandala-petal {
    position: absolute; top: 50%; left: 50%;
    width: 5px; height: 22px;
    border-radius: 3px;
    transform-origin: center 0;
    animation: mandala-bloom 2s ease-in-out infinite;
  }
  .mandala-petal:nth-child(1)  { transform: rotate(0deg)   translateY(-4px); background: #bf00ff; animation-delay: 0s; }
  .mandala-petal:nth-child(2)  { transform: rotate(30deg)  translateY(-4px); background: #ff073a; animation-delay: 0.16s; }
  .mandala-petal:nth-child(3)  { transform: rotate(60deg)  translateY(-4px); background: #fff700; animation-delay: 0.33s; }
  .mandala-petal:nth-child(4)  { transform: rotate(90deg)  translateY(-4px); background: #39ff14; animation-delay: 0.5s; }
  .mandala-petal:nth-child(5)  { transform: rotate(120deg) translateY(-4px); background: #0040ff; animation-delay: 0.66s; }
  .mandala-petal:nth-child(6)  { transform: rotate(150deg) translateY(-4px); background: #bf00ff; animation-delay: 0.83s; }
  .mandala-petal:nth-child(7)  { transform: rotate(180deg) translateY(-4px); background: #ff073a; animation-delay: 1s; }
  .mandala-petal:nth-child(8)  { transform: rotate(210deg) translateY(-4px); background: #fff700; animation-delay: 1.16s; }
  .mandala-petal:nth-child(9)  { transform: rotate(240deg) translateY(-4px); background: #39ff14; animation-delay: 1.33s; }
  .mandala-petal:nth-child(10) { transform: rotate(270deg) translateY(-4px); background: #0040ff; animation-delay: 1.5s; }
  .mandala-petal:nth-child(11) { transform: rotate(300deg) translateY(-4px); background: #bf00ff; animation-delay: 1.66s; }
  .mandala-petal:nth-child(12) { transform: rotate(330deg) translateY(-4px); background: #ff073a; animation-delay: 1.83s; }
  @keyframes mandala-bloom {
    0%,100% { height: 10px; opacity: 0.3; filter: blur(0px); }
    50%     { height: 26px; opacity: 1; filter: blur(1px); }
  }
  @keyframes mandala-hue { to { filter: hue-rotate(360deg); } }

  /* ========================================================
     #9 — INFINITY WAVE
     Figure-8 traced by a glowing orb with neon trail
     ======================================================== */
  .infinity { width: 70px; height: 40px; position: relative; }
  .inf-trail {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    animation: inf-path 3s ease-in-out infinite;
  }
  .inf-trail:nth-child(1) { background: #bf00ff; box-shadow: 0 0 12px #bf00ff, 0 0 24px #bf00ff66; animation-delay: 0s; }
  .inf-trail:nth-child(2) { background: #39ff14; box-shadow: 0 0 12px #39ff14, 0 0 24px #39ff1466; animation-delay: -0.4s; width: 8px; height: 8px; opacity: 0.8; }
  .inf-trail:nth-child(3) { background: #ff073a; box-shadow: 0 0 12px #ff073a, 0 0 24px #ff073a66; animation-delay: -0.8s; width: 6px; height: 6px; opacity: 0.6; }
  .inf-trail:nth-child(4) { background: #0040ff; box-shadow: 0 0 12px #0040ff, 0 0 24px #0040ff66; animation-delay: -1.2s; width: 5px; height: 5px; opacity: 0.4; }
  .inf-trail:nth-child(5) { background: #fff700; box-shadow: 0 0 12px #fff700, 0 0 24px #fff70066; animation-delay: -1.6s; width: 4px; height: 4px; opacity: 0.3; }
  @keyframes inf-path {
    0%    { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    12.5% { left: 75%; top: 20%; }
    25%   { left: 95%; top: 50%; transform: translate(-50%, -50%); }
    37.5% { left: 75%; top: 80%; }
    50%   { left: 50%; top: 50%; transform: translate(-50%, -50%); }
    62.5% { left: 25%; top: 20%; }
    75%   { left: 5%;  top: 50%; transform: translate(-50%, -50%); }
    87.5% { left: 25%; top: 80%; }
    100%  { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  }

  /* ========================================================
     #10 — GLITCH CUBE
     3D rotating cube with neon edges and glitch flickers
     ======================================================== */
  .cube-scene {
    width: 50px; height: 50px; perspective: 200px;
  }
  .cube {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    animation: cube-rotate 4s linear infinite;
  }
  .cube-face {
    position: absolute; width: 50px; height: 50px;
    border: 2px solid; background: transparent;
    opacity: 0.7;
  }
  .cube-face:nth-child(1) { border-color: #bf00ff; transform: translateZ(25px); box-shadow: inset 0 0 15px #bf00ff44; }
  .cube-face:nth-child(2) { border-color: #39ff14; transform: rotateY(90deg) translateZ(25px); box-shadow: inset 0 0 15px #39ff1444; }
  .cube-face:nth-child(3) { border-color: #ff073a; transform: rotateY(180deg) translateZ(25px); box-shadow: inset 0 0 15px #ff073a44; }
  .cube-face:nth-child(4) { border-color: #0040ff; transform: rotateY(-90deg) translateZ(25px); box-shadow: inset 0 0 15px #0040ff44; }
  .cube-face:nth-child(5) { border-color: #fff700; transform: rotateX(90deg) translateZ(25px); box-shadow: inset 0 0 15px #fff70044; }
  .cube-face:nth-child(6) { border-color: #bf00ff; transform: rotateX(-90deg) translateZ(25px); box-shadow: inset 0 0 15px #bf00ff44; }
  @keyframes cube-rotate {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    25%  { transform: rotateX(90deg) rotateY(90deg); }
    50%  { transform: rotateX(180deg) rotateY(180deg); }
    75%  { transform: rotateX(270deg) rotateY(270deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }
  .cube-scene::after {
    content: ''; position: absolute; inset: -5px; border-radius: 4px;
    background: conic-gradient(transparent, #bf00ff33, transparent, #39ff1433, transparent);
    animation: cube-rotate 6s linear infinite reverse;
    filter: blur(8px); opacity: 0.6;
  }
</style>
</head>
<body>

<h1>Acid Loading Animations &mdash; Pick Your Favorite</h1>

<div class="grid">

  <!-- #1 PLASMA ORB -->
  <div class="cell">
    <span class="num">#1</span>
    <div class="anim-wrap">
      <div class="plasma-orb"></div>

    <span class="label">Plasma Orb</span>

  <!-- #4 WORMHOLE TUNNEL -->
  <div class="cell">

        <div class="wh-ring"></div>
      </div>
    </div>
    <span class="label">Wormhole Tunnel</span>
  </div>

  </div>

  <!-- #7 FRACTAL TRIANGLES -->
  <div class="cell">
    <span class="num">#7</span>
    <div class="anim-wrap">
      <div class="fractal">
        <div class="fractal-tri"></div>
        <div class="fractal-tri"></div>
        <div class="fractal-tri"></div>
        <div class="fractal-tri"></div>
        <div class="fractal-tri"></div>
      </div>
    </div>
    <span class="label">Fractal Triangles</span>
  </div>

  <!-- #8 PULSING MANDALA -->
  <div class="cell">
    <span class="num">#8</span>
    <div class="anim-wrap">
      <div class="mandala">
        <div class="mandala-petal"></div><div class="mandala-petal"></div>
        <div class="mandala-petal"></div><div class="mandala-petal"></div>
        <div class="mandala-petal"></div><div class="mandala-petal"></div>
        <div class="mandala-petal"></div><div class="mandala-petal"></div>
        <div class="mandala-petal"></div><div class="mandala-petal"></div>
        <div class="mandala-petal"></div><div class="mandala-petal"></div>
      </div>
    </div>
    <span class="label">Pulsing Mandala</span>
  </div>

  <!-- #9 INFINITY WAVE -->
  <div class="cell">
    <span class="num">#9</span>
    <div class="anim-wrap">
      <div class="infinity">
        <div class="inf-trail"></div>
        <div class="inf-trail"></div>
        <div class="inf-trail"></div>
        <div class="inf-trail"></div>
        <div class="inf-trail"></div>
      </div>
    </div>
    <span class="label">Infinity Wave</span>
  </div>

  <!-- #10 GLITCH CUBE -->
  <div class="cell">
    <span class="num">#10</span>
    <div class="anim-wrap">
      <div class="cube-scene">
        <div class="cube">
          <div class="cube-face"></div>
          <div class="cube-face"></div>
          <div class="cube-face"></div>
          <div class="cube-face"></div>
          <div class="cube-face"></div>
          <div class="cube-face"></div>
        </div>
      </div>
    </div>
    <span class="label">Glitch Cube</span>
  </div>

</div>
